# 如果你想要用户输入或人在回路中交互
copilot-mode: True

# 这是研究提示。如果 num-papers-to-write > 1，可以将其视为"研究方向"，否则可以非常具体，作为完整的研究想法
research-topic: "你的目标是探索如何将3DGS的致密化操作用强化学习的方式代替，一个可选方向是用VGGT作为backbone提取三维特征"

