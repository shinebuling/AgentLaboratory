gitee-base-url: "https://ai.gitee.com/v1"

# Agent Laboratory 后端模型（可选：deepseek-chat, DeepSeek-V3等）
llm-backend: "DeepSeek-V3"
# 文献综述后端模型
lit-review-backend: "DeepSeek-V3"

# 基础语言
language: "Chinese"

# 要进行文献综述的arxiv论文数量
num-papers-lit-review: 5
# 顺序生成的论文总数
num-papers-to-write: 1
# 是否想要并行运行多个实验室？
parallel-labs: False

# 每个实验室的mle-solver最大步骤数
mlesolver-max-steps: 3
# 每个实验室的paper-solver最大步骤数
papersolver-max-steps: 1
# 该实验室的索引（用于并行运行）
lab-index: 1
# 是否要加载现有的保存
load-existing: False
# 如果失败，是否运行异常？
except-if-fail: False
# 在paper-solver期间是否将latex编译为PDF
compile-latex: False

# 任务说明
task-notes:
  plan-formulation:
    - '你应该制定一个实验计划，目标是用强化学习替代3D高斯散射(3DGS)的致密化操作'
    - '原始3DGS使用启发式规则（如梯度阈值）来决定何时分裂、克隆或删除高斯点'
    - '你的目标是设计一个强化学习智能体来学习更优的致密化策略'
    - '可选方向：使用VGGT作为backbone提取场景的三维特征来指导强化学习决策'
    - '你的实验计划应该包括：状态空间设计、动作空间定义、奖励函数设计、训练策略'
    - '需要考虑的评估指标：渲染质量(PSNR/SSIM)、高斯点数量、训练收敛速度'
    - "不要规划太久。尽快提交你的计划。"
  data-preparation:
    - '准备用于3DGS训练的多视角图像数据集（如NeRF Synthetic、Mip-NeRF360、Tanks&Temples等）'
    - '如果使用VGGT，需要准备相应的预训练模型权重'
    - '示例代码：\nimport torch\nfrom scene import Scene\nfrom gaussian_renderer import render\n\n# 加载场景数据\nscene = Scene(dataset_path, gaussians, load_iteration=None)\n# 获取训练视角\nviewpoint_stack = scene.getTrainCameras().copy()'
  running-experiments:
    - '实现强化学习环境，状态包括：当前高斯点的属性(位置、协方差、不透明度)、梯度统计信息、局部场景特征'
    - '定义动作空间：对每个高斯点决定是否分裂、克隆、删除或保持不变'
    - '设计奖励函数，平衡渲染质量和效率：reward = α * PSNR - β * num_gaussians - γ * training_time'
    - '使用PPO或SAC等成熟的强化学习算法进行训练'
    - '如果使用VGGT：\nimport vggt  # 假设VGGT库\nfeature_extractor = vggt.VGGT(pretrained=True)\nscene_features = feature_extractor(multi_view_images)'
    - '基线对比：实现原始3DGS的启发式致密化方法作为对比'
    - '在多个数据集上评估：至少包括一个合成数据集(NeRF Synthetic)和一个真实数据集(Mip-NeRF360)'
    - '记录训练曲线：PSNR、SSIM、LPIPS、高斯点数量随训练步数的变化'
    - '进行消融实验：测试不同奖励权重、不同状态表示、有无VGGT特征提取的影响'
    - '可视化结果：渲染图像对比、高斯点分布3D可视化、致密化决策热力图'
    - '确保实验可复现：固定随机种子、保存所有超参数配置'
    - '生成高质量的定性和定量结果图表，展示强化学习方法的优势'
  results-interpretation:
    - '对比强化学习方法与原始启发式方法在渲染质量(PSNR/SSIM/LPIPS)上的差异'
    - '分析高斯点数量和训练效率的权衡：强化学习是否能用更少的点达到相同质量？'
    - '讨论VGGT特征提取的作用：是否显著提升了致密化决策的质量？'
    - '分析失败案例：哪些场景类型强化学习方法表现不佳？可能的原因是什么？'
    - '总结强化学习方法的优势和局限性，以及未来改进方向'
  report-writing:
    - '论文结构应包括：摘要、引言(3DGS背景+强化学习动机)、相关工作、方法、实验、结果、讨论、结论'
    - '方法部分详细描述：状态空间、动作空间、奖励函数、训练算法、网络架构(如使用VGGT)'
    - '实验部分展示：定量对比表格、定性渲染结果对比、消融实验、训练曲线'
    - '讨论部分分析：为什么强化学习能改进致密化？学到的策略有何特点？计算开销如何？'
    - '强调创新点：首次将强化学习应用于3DGS致密化、VGGT特征提取的应用、性能改进'
    - '提供开源代码和预训练模型的链接（如适用）'